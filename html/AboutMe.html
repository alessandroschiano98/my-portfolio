<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ! FONTS CSS -->
    <link rel="stylesheet" href="/css/fonts.css">
    <!-- ! Link CSS -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/homepage.css">
    <link rel="stylesheet" href="/css/works.css">
    <link rel="stylesheet" href="/css/aboutme.css">
    <!-- ! Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- ! ICONS WEB link -->
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>

    <title>About Me</title>
</head>

<body>
    <section class="nav-homepage">
        <nav class="navbar">
            <div class="container">
                <a class="navbar-brand" href="homepage.html">
                    <img src="/img/logo.png" alt="Logo" class="logo">
                </a>
                <label class="hamburger">
                    <input type="checkbox" id="hamburger-checkbox" />
                    <svg viewBox="0 0 32 32">
                        <path class="line line-top-bottom"
                            d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22">
                        </path>
                        <path class="line" d="M7 16 27 16"></path>
                    </svg>
                </label>

                <div class="navbar-links">
                    <ul class="nav-list">
                        <li><a href="#" id="homepage-click">Homepage</a></li>
                        <li><a href="#" id="works-click">Works</a></li>
                        <li><a href="#" id="aboutme-click">About Me</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </section>

    <!-- ! HERO PROFILE SECTION -->
    <section class="about-hero">
        <div class="profile-container">
            
            <!-- CARD FOTO / AVATAR -->
            <div class="photo-frame">
                <div class="photo-wrapper">
                    <img src="/img/fotocv.png" alt="Alessandro Schiano" class="profile-img">
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span> Available for projects
                </div>
            </div>

            <!-- INFORMAZIONI E PRESENTAZIONE -->
            <div class="profile-details">
                <h1 class="profile-name">Alessandro Schiano</h1>
                <p class="profile-role">Born <b>Graphic Designer</b> and evolved into <b>Visual Designer</b>.</p>
                
                <div class="meta-tags">
                    <span class="meta-tag"><i class="fi fi-rr-marker"></i> Naples, Italy</span>
                    <span class="meta-tag"><i class="fi fi-rr-calendar"></i> 17th October 1998</span>
                    <span class="meta-tag"><i class="fi fi-sr-person-rays"></i> Visual & UI Creator</span>
                </div>
            </div>

        </div>
    </section>

    <!-- ! SKILLS SECTION -->
    <section class="skills-section">
        <h2 class="skills-title">Skills & Technologies</h2>
        <div class="skills-grid">
            
            <div class="skill-card">
                <h3>Frontend</h3>
                <div class="skill-icons">
                    <img src="/img/html-Icon.png" alt="HTML5" title="HTML5">
                    <img src="/img/css-Icon.png" alt="CSS" title="CSS">
                    <img src="/img/javascript-Icon.png" alt="JavaScript" title="JavaScript">
                    <img src="/img/react-Icon.png" alt="React" title="React">
                </div>
            </div>

            <div class="skill-card">
                <h3>Backend</h3>
                <div class="skill-icons">
                    <img src="/img/java-Icon.png" alt="Java" title="Java">
                    <img src="/img/spring-Icon.png" alt="Spring Boot" title="Spring Boot">
                    <img src="/img/mysqlWorkbench-Icon.png" alt="MySQL" title="MySQL Workbench">
                </div>
            </div>

            <div class="skill-card">
                <h3>Design / UX</h3>
                <div class="skill-icons">
                    <img src="/img/photoshop-Icon.png" alt="Photoshop" title="Adobe Photoshop">
                    <img src="/img/illustrator-Icon.png" alt="Illustrator" title="Adobe Illustrator">
                    <img src="/img/premiere-Icon.png" alt="Premiere" title="Adobe Premiere">
                    <img src="/img/canva-Icon.png" alt="Canva" title="Canva">
                </div>
            </div>

            <div class="skill-card">
                <h3>Other Tools</h3>
                <div class="skill-icons">
                    <img src="/img/github-Icon.png" alt="GitHub" title="Git Hub">
                    <img src="/img/bootstrap-Icon.png" alt="Bootstrap" title="Bootstrap">
                    <img src="/img/vscode-Icon.png" alt="VS Code" title="Visual Studio Code">
                </div>
            </div>

        </div>
    </section>

    <!-- ! Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- ! Link JavaScript -->
    <script src="/js/homepage.js"></script>
</body>

</html>
